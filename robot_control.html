<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OhmniRobot Control</title>
<style>
:root {
  --bg:    #0d0d1a; --card:  #13132b; --inset: #0a0a18;
  --brd:   #2a2a4a; --cyan:  #00e5ff; --green: #10b981;
  --amber: #f59e0b; --red:   #ef4444; --txt:   #e2e8f0;
  --muted: #64748b; --r: 10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);
  font-family:'Segoe UI',system-ui,sans-serif;
  display:flex;flex-direction:column;min-height:100vh;font-size:15px}

/* Header */
header{background:var(--card);border-bottom:1px solid var(--brd);
  padding:13px 18px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:10;gap:10px}
header h1{font-size:1.05rem;font-weight:700;color:var(--cyan);white-space:nowrap}
.badges{display:flex;gap:5px;flex-shrink:0}
.badge{padding:3px 9px;border-radius:20px;font-size:.7rem;font-weight:700;
  border:1px solid;transition:all .3s}
.badge.off {color:var(--muted);border-color:var(--brd)}
.badge.ok  {color:var(--green);border-color:var(--green);background:rgba(16,185,129,.12)}
.badge.warn{color:var(--amber);border-color:var(--amber);background:rgba(245,158,11,.12)}

/* Tabs */
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--brd);padding:0 14px}
.tab{padding:10px 16px;background:none;border:none;color:var(--muted);
  cursor:pointer;font-size:.85rem;font-weight:600;
  border-bottom:2px solid transparent;transition:all .2s}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}

/* Content */
.content{flex:1;padding:14px;max-width:500px;width:100%;margin:0 auto}
.pane{display:none}.pane.active{display:flex;flex-direction:column;gap:12px}

/* Card */
.card{background:var(--card);border:1px solid var(--brd);
  border-radius:var(--r);padding:16px}
.card-title{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;
  color:var(--muted);margin-bottom:12px}

/* Field */
.field{margin-bottom:9px}
.field label{display:block;font-size:.76rem;color:var(--muted);margin-bottom:3px}
.field input{width:100%;padding:8px 11px;background:var(--inset);
  border:1px solid var(--brd);border-radius:8px;color:var(--txt);
  font-size:.86rem;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--cyan)}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:5px;
  padding:9px 14px;border-radius:8px;border:none;font-size:.86rem;
  font-weight:700;cursor:pointer;transition:all .2s;width:100%;margin-top:5px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-cyan{background:var(--cyan);color:#000}
.btn-cyan:hover:not(:disabled){filter:brightness(1.1)}
.btn-red{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#000}
.btn-outline{background:transparent;border:1px solid var(--brd);
  color:var(--txt);width:auto;margin-top:0}
.btn-outline:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}
.btn-sm{padding:7px 12px;font-size:.78rem}
.row{display:flex;gap:7px;align-items:flex-end}
.row .field{flex:1;margin:0}

/* Status box */
.sbox{margin-top:9px;padding:8px 11px;background:var(--inset);border-radius:8px;
  border-left:3px solid var(--brd);font-size:.8rem;font-family:monospace;
  color:var(--muted);transition:all .3s;display:none}
.sbox.ok  {border-left-color:var(--green);color:var(--green);display:block}
.sbox.warn{border-left-color:var(--amber);color:var(--amber);display:block}
.sbox.err {border-left-color:var(--red);color:var(--red);display:block}
.sbox.show{display:block}

/* ── Scan Network List ── */
#scan-wrap{display:none;margin-top:10px}
.scan-status{font-size:.76rem;color:var(--muted);margin-bottom:6px;
  display:flex;align-items:center;gap:6px}
.spin{display:inline-block;animation:spin .8s linear infinite;font-size:.9rem}
@keyframes spin{to{transform:rotate(360deg)}}
#net-list{display:flex;flex-direction:column;gap:5px;max-height:220px;overflow-y:auto}
.net-item{display:flex;align-items:center;justify-content:space-between;
  padding:8px 11px;background:var(--inset);border-radius:8px;
  border:1px solid var(--brd);cursor:pointer;transition:all .15s;gap:8px}
.net-item:hover{border-color:var(--cyan);background:#0e0e2a}
.net-item.selected{border-color:var(--cyan);background:rgba(0,229,255,.06)}
.net-ssid{font-size:.86rem;font-weight:600;flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.net-meta{display:flex;align-items:center;gap:6px;flex-shrink:0}
.net-enc{font-size:.65rem;padding:1px 5px;border-radius:4px;font-weight:700}
.enc-open{background:rgba(16,185,129,.15);color:var(--green)}
.enc-wpa {background:rgba(245,158,11,.15);color:var(--amber)}
.enc-wpa2{background:rgba(0,229,255,.1);color:var(--cyan)}
.net-rssi{font-size:.8rem;font-family:monospace}
.rssi-strong{color:var(--green)}
.rssi-ok    {color:var(--amber)}
.rssi-weak  {color:var(--red)}

/* Speed + D-Pad */
.speed-wrap{margin-bottom:16px}
.speed-hdr{display:flex;justify-content:space-between;font-size:.78rem;
  color:var(--muted);margin-bottom:5px}
.speed-hdr em{color:var(--cyan);font-style:normal;font-weight:700}
input[type=range]{width:100%;accent-color:var(--cyan);cursor:pointer}
#cmd-banner{text-align:center;height:26px;font-size:.78rem;font-weight:700;
  letter-spacing:1px;color:var(--cyan);opacity:0;transition:opacity .15s;
  margin-bottom:8px}
#cmd-banner.show{opacity:1}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
  max-width:200px;margin:0 auto}
.dpad-btn{width:100%;aspect-ratio:1/1;background:var(--inset);
  border:1px solid var(--brd);border-radius:var(--r);color:var(--txt);
  font-size:1.45rem;cursor:pointer;transition:all .12s;
  user-select:none;-webkit-user-select:none;
  display:flex;align-items:center;justify-content:center}
.dpad-btn:active,.dpad-btn.on{background:var(--cyan);color:#000;
  border-color:var(--cyan);transform:scale(.92)}
.dpad-btn.stop-btn{background:rgba(239,68,68,.12);border-color:var(--red);
  color:var(--red);font-size:1.1rem}
.dpad-btn.stop-btn:active,.dpad-btn.stop-btn.on{background:var(--red);color:#fff}

/* Readout */
.readout{display:flex;gap:7px;margin-top:12px}
.ro-item{flex:1;background:var(--inset);border-radius:8px;padding:9px;text-align:center}
.ro-lbl{font-size:.65rem;color:var(--muted);margin-bottom:2px}
.ro-val{font-size:1.1rem;font-weight:700;font-family:monospace;color:var(--cyan)}

/* Info grid */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px}
.info-item{background:var(--inset);border-radius:7px;padding:7px 9px}
.info-lbl{font-size:.65rem;color:var(--muted);margin-bottom:1px}
.info-val{font-size:.8rem;font-family:monospace;color:var(--txt);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Log */
.log-panel{background:var(--card);border-top:1px solid var(--brd);
  display:flex;flex-direction:column;max-height:160px}
.log-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:6px 13px;border-bottom:1px solid var(--brd);
  font-size:.72rem;font-weight:700;color:var(--muted)}
.log-hdr button{background:none;border:none;color:var(--muted);
  cursor:pointer;font-size:.7rem}
#log{flex:1;overflow-y:auto;padding:5px 13px;font-family:monospace;font-size:.72rem}
.le{display:flex;gap:7px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.lt{color:var(--muted);flex-shrink:0}
.lm{color:var(--txt)}.lm.ok{color:var(--green)}.lm.err{color:var(--red)}.lm.info{color:var(--cyan)}
.note{font-size:.7rem;color:var(--muted);text-align:center;margin-top:5px}
.kb-hint{text-align:center;font-size:.7rem;color:var(--muted);margin-top:9px}
kbd{background:var(--inset);border:1px solid var(--brd);border-radius:4px;
  padding:1px 4px;font-size:.68rem}
</style>
</head>
<body>

<header>
  <h1>⚙ OhmniRobot</h1>
  <div class="badges">
    <span class="badge off" id="b-ble">BLE</span>
    <span class="badge off" id="b-wifi">WiFi</span>
    <span class="badge off" id="b-http">HTTP</span>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="setup">Setup</button>
  <button class="tab"        data-tab="ctrl" >Điều khiển</button>
</div>

<div class="content">

  <!-- ══ TAB: SETUP ══════════════════════════════════════════════════════════ -->
  <div id="pane-setup" class="pane active">

    <!-- Bước 1: Kết nối BLE -->
    <div class="card">
      <div class="card-title">Bước 1 — Kết nối BLE</div>
      <button class="btn btn-cyan" id="btn-ble" onclick="toggleBLE()">Kết nối BLE</button>
      <div class="sbox" id="ble-box"></div>
      <p class="note">Yêu cầu Chrome / Edge · HTTPS hoặc localhost</p>
    </div>

    <!-- Bước 2: Scan WiFi -->
    <div class="card">
      <div class="card-title">Bước 2 — Quét mạng WiFi</div>
      <button class="btn btn-outline" id="btn-scan" onclick="scanWiFi()" disabled>
        Quét mạng WiFi
      </button>

      <div id="scan-wrap">
        <div class="scan-status" id="scan-status"></div>
        <div id="net-list"></div>
      </div>
    </div>

    <!-- Bước 3: Gửi credentials -->
    <div class="card">
      <div class="card-title">Bước 3 — Kết nối WiFi</div>
      <div class="field">
        <label>WiFi SSID</label>
        <input id="ssid" type="text" placeholder="Chọn mạng ở trên hoặc nhập thủ công" autocomplete="off">
      </div>
      <div class="field" id="pass-field">
        <label>Password <span id="pass-hint" style="color:var(--green);font-size:.7rem"></span></label>
        <input id="pass" type="password" placeholder="Mật khẩu WiFi">
      </div>
      <button class="btn btn-cyan" id="btn-wifi" onclick="sendWiFi()" disabled>
        Kết nối Robot đến WiFi
      </button>
      <div class="sbox" id="prov-box"></div>
    </div>

    <!-- Thông tin sau khi kết nối -->
    <div class="card" id="conn-info-card" style="display:none">
      <div class="card-title">Thông tin kết nối</div>
      <div class="info-grid" id="conn-info-grid"></div>
    </div>

  </div>

  <!-- ══ TAB: CONTROL ══════════════════════════════════════════════════════════ -->
  <div id="pane-ctrl" class="pane">

    <div class="card">
      <div class="card-title">Robot</div>
      <div class="row">
        <div class="field">
          <label>IP Address</label>
          <input id="robot-ip" type="text" placeholder="192.168.x.x">
        </div>
        <button class="btn btn-outline btn-sm" onclick="pingRobot()">Ping</button>
      </div>
      <div class="readout" id="readout" style="display:none">
        <div class="ro-item"><div class="ro-lbl">Left</div><div class="ro-val" id="rv-left">0.0</div></div>
        <div class="ro-item"><div class="ro-lbl">Right</div><div class="ro-val" id="rv-right">0.0</div></div>
        <div class="ro-item"><div class="ro-lbl">State</div><div class="ro-val" id="rv-state" style="font-size:.78rem">—</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Điều khiển</div>
      <div class="speed-wrap">
        <div class="speed-hdr">Tốc độ &nbsp;<em id="spd-val">20</em> rad/s</div>
        <input type="range" id="speed" min="5" max="40" value="20"
          oninput="document.getElementById('spd-val').textContent=this.value">
      </div>
      <div id="cmd-banner">—</div>
      <div class="dpad">
        <div></div>
        <button class="dpad-btn" id="db-forward"  data-cmd="forward" >▲</button>
        <div></div>
        <button class="dpad-btn" id="db-left"     data-cmd="left"   >◄</button>
        <button class="dpad-btn stop-btn" id="db-stop" data-cmd="stop">■</button>
        <button class="dpad-btn" id="db-right"    data-cmd="right"  >►</button>
        <div></div>
        <button class="dpad-btn" id="db-backward" data-cmd="backward">▼</button>
        <div></div>
      </div>
      <p class="kb-hint">
        <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> di chuyển &nbsp;·&nbsp;
        <kbd>Space</kbd> dừng &nbsp;·&nbsp; Giữ để di chuyển liên tục
      </p>
    </div>

  </div>
</div>

<div class="log-panel">
  <div class="log-hdr">
    <span>Log</span>
    <button onclick="document.getElementById('log').innerHTML=''">Xóa</button>
  </div>
  <div id="log"></div>
</div>

<script>
// ── BLE UUIDs ────────────────────────────────────────────────────────────────
const SVC      = '12345678-0000-1000-8000-00805f9b34fb';
const SSID_CH  = '12345678-0001-1000-8000-00805f9b34fb';
const PASS_CH  = '12345678-0002-1000-8000-00805f9b34fb';
const STAT_CH  = '12345678-0003-1000-8000-00805f9b34fb';
const CMD_CH   = '12345678-0004-1000-8000-00805f9b34fb';

// ── State ────────────────────────────────────────────────────────────────────
let bleDevice = null;
let ssidCh = null, passCh = null, statCh = null, cmdCh = null;
let pollTimer = null;
let scannedNets = [];   // [{ssid, rssi, enc}]

// ── Log ──────────────────────────────────────────────────────────────────────
function log(msg, type = '') {
  const t = new Date().toTimeString().slice(0, 8);
  const d = document.createElement('div');
  d.className = 'le';
  d.innerHTML = `<span class="lt">${t}</span><span class="lm ${type}">${escHtml(msg)}</span>`;
  const el = document.getElementById('log');
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Tabs ─────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('pane-' + t.dataset.tab).classList.add('active');
}));

// ── Badge ─────────────────────────────────────────────────────────────────────
function badge(id, cls, txt) {
  const el = document.getElementById('b-' + id);
  el.className = 'badge ' + cls;
  el.textContent = txt;
}

// ── BLE Connect ──────────────────────────────────────────────────────────────
async function toggleBLE() {
  if (bleDevice?.gatt.connected) { bleDevice.gatt.disconnect(); return; }
  if (!navigator.bluetooth) {
    log('Web Bluetooth không khả dụng. Dùng Chrome/Edge qua HTTPS.', 'err');
    return;
  }
  try {
    log('Đang quét BLE...', 'info');
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'OhmniRobot' }],
      optionalServices: [SVC]
    });
    bleDevice.addEventListener('gattserverdisconnected', () => {
      setBLE(false); log('BLE ngắt kết nối.', 'err');
    });
    const srv = await bleDevice.gatt.connect();
    const svc = await srv.getPrimaryService(SVC);
    ssidCh = await svc.getCharacteristic(SSID_CH);
    passCh = await svc.getCharacteristic(PASS_CH);
    statCh = await svc.getCharacteristic(STAT_CH);
    cmdCh  = await svc.getCharacteristic(CMD_CH);
    await statCh.startNotifications();
    statCh.addEventListener('characteristicvaluechanged', e =>
      onBLENotify(new TextDecoder().decode(e.target.value)));
    setBLE(true);
    log('BLE kết nối: ' + bleDevice.name, 'ok');
    const v = await statCh.readValue();
    onBLENotify(new TextDecoder().decode(v));
  } catch(e) {
    log('BLE lỗi: ' + e.message, 'err');
  }
}

function setBLE(on) {
  const btn  = document.getElementById('btn-ble');
  const scan = document.getElementById('btn-scan');
  const wifi = document.getElementById('btn-wifi');
  if (on) {
    btn.textContent = 'Ngắt BLE';
    btn.className   = 'btn btn-red';
    document.getElementById('ble-box').className   = 'sbox ok';
    document.getElementById('ble-box').textContent = '● Đã kết nối: ' + (bleDevice?.name || '');
    scan.disabled = false;
    wifi.disabled = false;
    badge('ble', 'ok', 'BLE');
  } else {
    btn.textContent = 'Kết nối BLE';
    btn.className   = 'btn btn-cyan';
    document.getElementById('ble-box').className   = 'sbox err';
    document.getElementById('ble-box').textContent = '✕ Chưa kết nối';
    scan.disabled = wifi.disabled = true;
    badge('ble', 'off', 'BLE');
    ssidCh = passCh = statCh = cmdCh = bleDevice = null;
  }
}

// ── WiFi Scan ─────────────────────────────────────────────────────────────────
async function scanWiFi() {
  if (!cmdCh) { log('Chưa kết nối BLE.', 'err'); return; }
  try {
    scannedNets = [];
    document.getElementById('net-list').innerHTML = '';
    document.getElementById('scan-wrap').style.display = 'block';
    setScanStatus('scanning', 'Đang quét...');
    await cmdCh.writeValue(new TextEncoder().encode('SCAN'));
    log('Đã gửi lệnh SCAN.', 'info');
  } catch(e) {
    log('Scan lỗi: ' + e.message, 'err');
  }
}

function setScanStatus(type, msg) {
  const el = document.getElementById('scan-status');
  if (type === 'scanning') {
    el.innerHTML = `<span class="spin">⟳</span> ${msg}`;
    el.style.color = 'var(--amber)';
  } else if (type === 'done') {
    el.innerHTML = `✓ ${msg}`;
    el.style.color = 'var(--green)';
  } else {
    el.innerHTML = msg;
    el.style.color = 'var(--muted)';
  }
}

function rssiClass(rssi) {
  if (rssi >= -60) return 'rssi-strong';
  if (rssi >= -75) return 'rssi-ok';
  return 'rssi-weak';
}

function rssiBars(rssi) {
  if (rssi >= -60) return '▂▄▆█';
  if (rssi >= -75) return '▂▄▆·';
  return '▂▄··';
}

function addNetItem(ssid, rssi, enc) {
  const list = document.getElementById('net-list');
  const item = document.createElement('div');
  item.className = 'net-item';
  item.dataset.ssid = ssid;
  item.dataset.enc  = enc;

  const encClass = enc === 'OPEN' ? 'enc-open' : enc === 'WPA' ? 'enc-wpa' : 'enc-wpa2';
  item.innerHTML = `
    <span class="net-ssid">${escHtml(ssid)}</span>
    <span class="net-meta">
      <span class="net-enc ${encClass}">${enc}</span>
      <span class="net-rssi ${rssiClass(rssi)}" title="${rssi} dBm">${rssiBars(rssi)}</span>
    </span>`;

  item.addEventListener('click', () => selectNetwork(ssid, enc, item));
  list.appendChild(item);
}

function selectNetwork(ssid, enc, el) {
  document.querySelectorAll('.net-item').forEach(i => i.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('ssid').value = ssid;

  const passField = document.getElementById('pass-field');
  const passHint  = document.getElementById('pass-hint');
  const passInput = document.getElementById('pass');

  if (enc === 'OPEN') {
    passField.style.opacity = '0.4';
    passInput.disabled = true;
    passInput.value    = '';
    passInput.placeholder = '(Mạng mở — không cần password)';
    passHint.textContent = '— Mạng mở';
  } else {
    passField.style.opacity = '1';
    passInput.disabled = false;
    passInput.placeholder = 'Mật khẩu WiFi';
    passHint.textContent = '';
    passInput.focus();
  }
  log(`Đã chọn: ${ssid} (${enc})`, 'info');
}

// ── BLE Notification handler ──────────────────────────────────────────────────
function onBLENotify(msg) {
  // Không log SCAN: vào log chính (quá nhiều)
  if (!msg.startsWith('SCAN:')) log('BLE: ' + msg, 'info');

  // WiFi Scan messages
  if (msg === 'SCANNING') {
    setScanStatus('scanning', 'ESP32 đang quét...');

  } else if (msg.startsWith('SCAN_START:')) {
    const n = msg.split(':')[1];
    setScanStatus('scanning', `Đang nhận ${n} mạng...`);

  } else if (msg.startsWith('SCAN:')) {
    // Format: SCAN:ssid|rssi|enc
    const body  = msg.slice(5);
    const parts = body.split('|');
    if (parts.length >= 3) {
      const ssid = parts[0];
      const rssi = parseInt(parts[1]);
      const enc  = parts[2];
      scannedNets.push({ ssid, rssi, enc });
      addNetItem(ssid, rssi, enc);
    }

  } else if (msg.startsWith('SCAN_END:')) {
    const n = msg.split(':')[1];
    setScanStatus('done', `Tìm thấy ${n} mạng WiFi`);
    // Sort by RSSI (mạnh nhất lên đầu)
    sortNetList();

  } else if (msg === 'SCAN_ERR') {
    setScanStatus('', '✕ Scan thất bại');

  // WiFi provisioning messages
  } else if (msg === 'WAITING') {
    setProvBox('show', msg);

  } else if (msg === 'CONNECTING') {
    setProvBox('warn', '⟳ Đang kết nối WiFi...');
    badge('wifi', 'warn', 'WiFi…');

  } else if (msg.startsWith('CONNECTED:')) {
    // Format: CONNECTED:ip|ssid|rssi|gw
    const parts = msg.slice(10).split('|');
    const ip    = parts[0] || '?';
    const ssid  = parts[1] || '?';
    const rssi  = parts[2] || '?';
    const gw    = parts[3] || '?';

    setProvBox('ok', `✓ WiFi OK — ${ip}`);
    badge('wifi', 'ok', 'WiFi');
    document.getElementById('robot-ip').value = ip;
    showConnInfo(ip, ssid, rssi, gw);
    log(`Kết nối thành công! IP=${ip} SSID=${ssid} RSSI=${rssi}dBm`, 'ok');

    setTimeout(() => {
      document.querySelector('[data-tab="ctrl"]').click();
      startPoll(ip);
    }, 1000);

  } else if (msg === 'WIFI_FAILED') {
    setProvBox('err', '✕ WiFi thất bại — kiểm tra SSID / Password');
    badge('wifi', 'off', 'WiFi');
  }
}

function setProvBox(cls, txt) {
  const el = document.getElementById('prov-box');
  el.className   = cls ? 'sbox ' + cls : 'sbox show';
  el.textContent = txt;
}

function showConnInfo(ip, ssid, rssi, gw) {
  const card = document.getElementById('conn-info-card');
  const grid = document.getElementById('conn-info-grid');
  grid.innerHTML = `
    <div class="info-item"><div class="info-lbl">IP</div><div class="info-val">${ip}</div></div>
    <div class="info-item"><div class="info-lbl">SSID</div><div class="info-val">${escHtml(ssid)}</div></div>
    <div class="info-item"><div class="info-lbl">RSSI</div><div class="info-val">${rssi} dBm</div></div>
    <div class="info-item"><div class="info-lbl">Gateway</div><div class="info-val">${gw}</div></div>
    <div class="info-item" style="grid-column:1/-1">
      <div class="info-lbl">HTTP URL</div>
      <div class="info-val">http://${ip}/</div>
    </div>`;
  card.style.display = 'block';
}

function sortNetList() {
  const list  = document.getElementById('net-list');
  const items = [...list.querySelectorAll('.net-item')];
  items.sort((a, b) => {
    const ra = scannedNets.find(n => n.ssid === a.dataset.ssid)?.rssi || -100;
    const rb = scannedNets.find(n => n.ssid === b.dataset.ssid)?.rssi || -100;
    return rb - ra;
  });
  items.forEach(i => list.appendChild(i));
}

// ── Send WiFi ─────────────────────────────────────────────────────────────────
async function sendWiFi() {
  if (!ssidCh || !passCh) { log('Chưa kết nối BLE.', 'err'); return; }
  const ssid = document.getElementById('ssid').value.trim();
  const pass = document.getElementById('pass').disabled ? '' : document.getElementById('pass').value;
  if (!ssid) { log('Nhập hoặc chọn SSID trước.', 'err'); return; }

  try {
    const enc = new TextEncoder();
    await ssidCh.writeValue(enc.encode(ssid));
    log(`Đã gửi SSID: ${ssid}`, 'ok');
    await passCh.writeValue(enc.encode(pass));
    log(pass ? 'Đã gửi Password.' : 'Gửi password rỗng (mạng mở).', 'ok');
  } catch(e) {
    log('Gửi lỗi: ' + e.message, 'err');
  }
}

// ── HTTP Control ──────────────────────────────────────────────────────────────
function ip()  { return document.getElementById('robot-ip').value.trim(); }
function spd() { return document.getElementById('speed').value; }

async function sendCmd(cmd) {
  const h = ip();
  if (!h) { log('Nhập Robot IP.', 'err'); return; }
  const url = cmd === 'stop' ? `http://${h}/stop` : `http://${h}/${cmd}?speed=${spd()}`;
  try {
    const r = await fetch(url);
    const d = await r.json();
    if (d.ok) { updateReadout(d.target_left, d.target_right, cmd); badge('http','ok','HTTP'); }
    log(`→ ${cmd}${cmd!=='stop'?'('+spd()+')':''} ${JSON.stringify(d)}`, d.ok?'ok':'err');
  } catch(e) {
    log(`HTTP [${cmd}]: ${e.message}`, 'err');
    badge('http', 'off', 'HTTP');
  }
}

async function pingRobot() {
  const h = ip();
  if (!h) { log('Nhập IP.', 'err'); return; }
  try {
    const r = await fetch(`http://${h}/status`);
    const d = await r.json();
    log('Ping: ' + JSON.stringify(d), 'ok');
    updateReadout(d.target_left, d.target_right, 'status');
    badge('http', 'ok', 'HTTP');
    startPoll(h);
  } catch(e) {
    log('Ping lỗi: ' + e.message, 'err');
    badge('http', 'off', 'HTTP');
  }
}

function updateReadout(left, right, cmd) {
  document.getElementById('rv-left').textContent  = Number(left).toFixed(1);
  document.getElementById('rv-right').textContent = Number(right).toFixed(1);
  const L = {forward:'▲ TIẾN',backward:'▼ LÙI',left:'◄ TRÁI',right:'► PHẢI',stop:'■ DỪNG',status:'OK'};
  document.getElementById('rv-state').textContent = L[cmd] || cmd;
  document.getElementById('readout').style.display = 'flex';
}

function startPoll(h) {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const r = await fetch(`http://${h}/status`);
      const d = await r.json();
      updateReadout(d.target_left, d.target_right, 'status');
    } catch { clearInterval(pollTimer); }
  }, 2000);
}

// ── D-Pad (giữ = chạy, nhả = dừng) ──────────────────────────────────────────
const LABEL = {forward:'▲ TIẾN',backward:'▼ LÙI',left:'◄ TRÁI',right:'► PHẢI',stop:'■ DỪNG'};

document.querySelectorAll('.dpad-btn').forEach(btn => {
  const cmd = btn.dataset.cmd;
  const press   = () => { btn.classList.add('on');
    document.getElementById('cmd-banner').textContent = cmd==='stop'?'■ DỪNG':`${LABEL[cmd]} — ${spd()} rad/s`;
    document.getElementById('cmd-banner').className = 'show';
    sendCmd(cmd); };
  const release = () => { btn.classList.remove('on');
    if (cmd !== 'stop') { sendCmd('stop'); document.getElementById('cmd-banner').className=''; }};
  btn.addEventListener('mousedown',  press);
  btn.addEventListener('mouseup',    release);
  btn.addEventListener('mouseleave', release);
  btn.addEventListener('touchstart', e => { e.preventDefault(); press(); });
  btn.addEventListener('touchend',   e => { e.preventDefault(); release(); });
});

// ── Keyboard ──────────────────────────────────────────────────────────────────
const KEYS = {ArrowUp:'forward',ArrowDown:'backward',ArrowLeft:'left',ArrowRight:'right',' ':'stop'};
const held = new Set();
document.addEventListener('keydown', e => {
  const cmd = KEYS[e.key];
  if (!cmd || held.has(e.key)) return;
  e.preventDefault(); held.add(e.key);
  document.getElementById('db-'+cmd)?.classList.add('on');
  sendCmd(cmd);
});
document.addEventListener('keyup', e => {
  const cmd = KEYS[e.key];
  if (!cmd) return;
  held.delete(e.key);
  document.getElementById('db-'+cmd)?.classList.remove('on');
  if (cmd !== 'stop') sendCmd('stop');
});
</script>
